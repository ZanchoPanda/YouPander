
name: Build YouPander macOS

on:
  workflow_dispatch:

  release:
    types: [published]

permissions:
  contents: write

jobs:

  build-macos:
    name: Build macOS ${{ matrix.arch }}

    if: startsWith(github.event.release.tag_name, 'v') || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: maccatalyst-x64
            runner: macos-26-intel

          - arch: arm64
            rid: maccatalyst-arm64
            runner: macos-26

    runs-on: ${{ matrix.runner }}

    steps:

      # 1. Descargar el código correspondiente al tag
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # 2. Instalar .NET 10.0.401
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      # 3. Verificar SDK seleccionado
      - name: Verify .NET SDK
        run: |
          echo "=== Installed SDKs ==="
          dotnet --list-sdks

          echo "=== Selected SDK ==="
          dotnet --version

          if [[ "$(dotnet --version)" != "10.0.401" ]]; then
            echo "ERROR: Se necesita exactamente .NET SDK 10.0.401"
            exit 1
          fi

      # 4. Seleccionar e inicializar Xcode 26.6
      - name: Configure Xcode
        run: |
          if [ ! -d "/Applications/Xcode_26.6.app" ]; then
            echo "ERROR: No se encuentra Xcode 26.6"
            ls -d /Applications/Xcode*.app
            exit 1
          fi

          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch

          echo "=== Xcode version ==="
          xcodebuild -version

          xcrun --find actool

      # 5. Instalar MAUI
      - name: Install MAUI workload
        run: |
          dotnet workload install maui \
            --version 10.0.401

      # 6. Comprobar workloads
      - name: Verify MAUI workloads
        run: |
          dotnet workload --version
          dotnet workload list

      # 7. Instalar create-dmg
      - name: Install create-dmg
        run: |
          brew install create-dmg

      # 8. Comprobar entorno
      - name: Check build environment
        run: |
          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== .NET ==="
          dotnet --info

          echo "=== actool ==="
          xcrun --find actool

      # 9. Compilar aplicación
      - name: Publish YouPander
        run: |
          dotnet publish YouPander.csproj \
            -f net10.0-maccatalyst \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:CreatePackage=false \
            -p:EnableCodeSigning=false

      # 10. Localizar aplicación compilada
      - name: Locate application
        run: |
          APP_PATH=$(find bin/Release/net10.0-maccatalyst \
            -name "YouPander.app" \
            -type d \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró YouPander.app"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # 11. Preparar DMG
      - name: Prepare DMG
        run: |
          mkdir -p staging

          ditto "$APP_PATH" "staging/YouPander.app"

          ln -s /Applications staging/Applications

      # 12. Crear instalador DMG
      - name: Generate DMG
        run: |
          mkdir -p Output

          create-dmg \
            --volname "YouPander" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 200 \
            --icon "YouPander.app" 150 200 \
            "Output/YouPander_${{ github.event.release.tag_name || github.ref_name }}_macOS_${{ matrix.arch }}.dmg" \
            "staging"

      # 13. Subir DMG como artefacto
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: YouPander-macOS-${{ matrix.arch }}
          path: Output/*.dmg
          if-no-files-found: error

  # ==========================================
  # AÑADIR DMG A LA RELEASE EXISTENTE
  # ==========================================

  release:
    name: Attach DMG to GitHub Release

    needs: build-macos

    if: startsWith(github.event.release.tag_name, 'v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # 1. Descargar los dos DMG
      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: YouPander-macOS-*
          path: release-assets
          merge-multiple: true

      # 2. Adjuntar los DMG a la Release existente
      - name: Upload DMG to existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload "$TAG_NAME" \
            release-assets/*.dmg \
            --repo "$REPOSITORY"
